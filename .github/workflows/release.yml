# Publishes a GitHub Release with the ready-to-load extension zip whenever a version tag (v1.2.3) is pushed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - name: Package
        run: |
          cd dist
          zip -r "../sub-pip-${GITHUB_REF_NAME}.zip" .
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## ${VERSION}" '$0 ~ "^"v"( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release ${GITHUB_REF_NAME}" > notes.md; fi
          cat >> notes.md <<'TXT'

          ## Install
          1. Download `sub-pip-*.zip` below and extract it to a folder that stays put.
          2. Open `chrome://extensions`, turn on **Developer mode**, click **Load unpacked** and pick the extracted folder.
          3. Updating: replace the folder's contents with the new zip, then click the reload icon on the extension card and refresh your video tabs.
          TXT
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" "sub-pip-${GITHUB_REF_NAME}.zip" --title "Sub PiP ${GITHUB_REF_NAME}" --notes-file notes.md
